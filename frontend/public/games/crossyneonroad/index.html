          sfxBtn.title = this.isSfxMuted ? (t.sfxOn || 'Soundeffekte einschalten (S)') : (t.sfxOff || 'Soundeffekte stummschalten (S)');
        }
        if (musicBtn) {
          musicBtn.innerHTML = '🎵';
          musicBtn.className = 'audio-btn' + (this.isMusicMuted ? ' muted' : '');
          musicBtn.title = this.isMusicMuted ? (t.musicOn || 'Musik einschalten (M)') : (t.musicOff || 'Musik stummschalten (M)');
        }
      }

      toggleSfx() {
        this.isSfxMuted = !this.isSfxMuted;
        try { localStorage.setItem('tggamehub_sfx_muted', this.isSfxMuted ? 'true' : 'false'); } catch(e) {}
        this.updateButtons();
      }

      toggleMusic() {
        this.isMusicMuted = !this.isMusicMuted;
        try { localStorage.setItem('tggamehub_music_muted', this.isMusicMuted ? 'true' : 'false'); } catch(e) {}
        this.updateButtons();
        if (this.isMusicMuted) {
          this.stopMusic();
        } else if (gameState === 'playing') {
          this.startMusic();
        }
      }

      playHop() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playCoin() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;
        const playChimeNote = (freq, delay, vol) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(vol, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.15);
          osc.start(now + delay);
          osc.stop(now + delay + 0.16);
        };

        playChimeNote(880.00, 0, 0.05);
        playChimeNote(1046.50, 0.06, 0.05);
      }

      playShield() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;
        const playLaserNote = (freqStart, freqEnd, delay, vol) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freqStart, now + delay);
          osc.frequency.exponentialRampToValueAtTime(freqEnd, now + delay + 0.25);
          gain.gain.setValueAtTime(vol, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.25);
          osc.start(now + delay);
          osc.stop(now + delay + 0.26);
        };

        playLaserNote(400, 1200, 0, 0.04);
        playLaserNote(600, 1600, 0.08, 0.04);
      }

      playCrash() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.45);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.48);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.48);
      }

      playSplash() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noiseNode = this.ctx.createBufferSource();
        noiseNode.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 4.0;
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
        noiseNode.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noiseNode.start();
        noiseNode.stop(this.ctx.currentTime + 0.35);
      }

      playTrainWarning() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;

        // Authentic railway crossing signal bell synthesis ("ding ding-ding")
        const playBellDing = (freq, delay, volume = 0.08) => {
          const startTime = now + delay;
          const osc1 = this.ctx.createOscillator(); // Fundamental bell strike
          const osc2 = this.ctx.createOscillator(); // Metallic harmonic overtone
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, startTime);

          // Metallic brass overtone (2.76x physical bell ratio)
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2.76, startTime);

          // Acoustic bell decay envelope: instant metallic attack & warm ringing tail
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.003);
          gain.gain.exponentialRampToValueAtTime(volume * 0.45, startTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.22);

          // Bandpass filter for bright, realistic railway chime
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 1.15, startTime);
          filter.Q.setValueAtTime(2.8, startTime);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(filter);
          filter.connect(this.ctx.destination);

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + 0.25);
          osc2.stop(startTime + 0.25);
        };

        // Signature train signal rhythm: "Ding... Ding-Ding"
        playBellDing(1046.50, 0.00, 0.08); // C6 "Ding"
        playBellDing(1046.50, 0.16, 0.075); // C6 "Ding"
        playBellDing(1174.66, 0.28, 0.085); // D6 "Ding!"
      }

      playGameOver() {
        this.init();
        if (!this.ctx || this.isSfxMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;
        const playSadNote = (freq, delay, duration) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + delay);
          gain.gain.setValueAtTime(0.06, now + delay);
          gain.gain.linearRampToValueAtTime(0.001, now + delay + duration);
          osc.start(now + delay);
          osc.stop(now + delay + duration);
        };

        playSadNote(329.63, 0, 0.25);
        playSadNote(293.66, 0.2, 0.25);
        playSadNote(220.00, 0.4, 0.6);
      }

      playSynthNote(midiNote, time, duration) {
        if (!this.ctx || this.isMusicMuted) return;

        const osc = this.ctx.createOscillator();
        const subOsc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.connect(filter);
        subOsc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.ctx.destination);

        const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
        
        if (midiNote < 55) {
          // Warm deep ambient bass
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);

          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(freq, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(260, time);

          const bassVol = 0.016;
          gainNode.gain.setValueAtTime(0, time);
          gainNode.gain.linearRampToValueAtTime(bassVol, time + 0.04);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, time + duration + 1.6);
        } else if (midiNote < 71) {
          // Warm polyphonic harmonic chords / pads
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);

          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(freq, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, time);

          const chordVol = 0.013;
          gainNode.gain.setValueAtTime(0, time);
          gainNode.gain.linearRampToValueAtTime(chordVol, time + 0.03);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, time + duration + 1.2);
        } else {
          // Warm crystal celesta / cyber lead melody
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);

          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(freq * 2, time); // Soft celestial octave sparkle

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1250, time); // Softened to eliminate harshness

          const melodyVol = 0.018;
          gainNode.gain.setValueAtTime(0, time);
          gainNode.gain.linearRampToValueAtTime(melodyVol, time + 0.03);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, time + duration + 1.0);
        }

        osc.start(time);
        osc.stop(time + duration + 2.0);
        subOsc.start(time);
        subOsc.stop(time + duration + 2.0);
        this.activeOscillators.push(osc, subOsc);
      }

      startMusic() {
        this.init();
        if (!this.ctx || this.isMusicMuted || this.musicPlaying) return;
        this.musicPlaying = true;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.notePointer = 0;
        this.startTime = this.ctx.currentTime;

        const scheduler = () => {
          if (!this.musicPlaying || this.isMusicMuted) return;
          const now = this.ctx.currentTime - this.startTime;
          while (this.notePointer < CANON_NOTES.length) {
            const note = CANON_NOTES[this.notePointer];
            const noteStart = note[1];
            if (noteStart < now + this.lookAhead) {
              this.playSynthNote(note[0], this.startTime + noteStart, note[2]);
              this.notePointer++;
            } else {
              break;
            }
          }
          if (this.notePointer >= CANON_NOTES.length) {
            const lastNote = CANON_NOTES[CANON_NOTES.length - 1];
            const pieceEnd = lastNote[1] + lastNote[2] + 1.5;
            if (now > pieceEnd) {
              this.notePointer = 0;
              this.startTime = this.ctx.currentTime;
            }
          }
        };

        this.bgMusicTimer = setInterval(scheduler, this.scheduleInterval);
      }

      stopMusic() {
        this.musicPlaying = false;
        if (this.bgMusicTimer) {
          clearInterval(this.bgMusicTimer);
          this.bgMusicTimer = null;
        }
        this.activeOscillators.forEach(osc => {
          try { osc.stop(); } catch(e) {}
        });
        this.activeOscillators = [];
      }
    }

    const soundManager = new SoundSynth();

    document.getElementById('sfxBtn').addEventListener('click', (e) => { e.stopPropagation(); soundManager.toggleSfx(); });
    document.getElementById('musicBtn').addEventListener('click', (e) => { e.stopPropagation(); soundManager.toggleMusic(); });

    // Particles System
    class SparkParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.radius = 2 + Math.random() * 3;
        this.color = color;
        this.alpha = 1.0;
        this.decay = 0.02 + Math.random() * 0.03;
      }

      update(dt = 1) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.alpha -= this.decay * dt;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, canvas.height - (this.y - cameraY), this.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Progressive Difficulty & Stage Calculator
    // Stage 1: 0-50m (Low traffic, no rivers, rare trains)
    // Stage 2: 51-100m (More trains, moderate traffic, no rivers)
    // Stage 3: 101-200m (Rivers & floating logs introduced, trains & roads)
    // Stage 4: 201-300m (Heavy traffic, faster currents & bullet trains)
    // Stage 5: 301m+ (HARDCORE Overdrive until game over)
    function getDifficulty(currentScore) {
      const s = Math.max(0, currentScore || 0);
      let level = 1;
      let badgeColor = '#4ade80';

      if (s > 300) {
        level = 5;
        badgeColor = '#ffd358'; // Hardcore Gold
      } else if (s > 200) {
        level = 4;
        badgeColor = '#ff007f'; // Neon Pink
      } else if (s > 100) {
        level = 3;
        badgeColor = '#a78bfa'; // Neon Purple
      } else if (s > 50) {
        level = 2;
        badgeColor = '#00f2fe'; // Neon Cyan
      } else {
        level = 1;
        badgeColor = '#4ade80'; // Neon Green
      }

      const stageInfo = (t.stages && t.stages[level]) ? t.stages[level] : { name: `EBENE ${level}`, sector: '' };
      const levelName = stageInfo.name;
      const sectorName = stageInfo.sector;

      return { level, levelName, sectorName, badgeColor };
    }

    // Dynamic Road/River lanes obstacle generator
    class Obstacle {
      constructor(rowIdx, type, isLeftToRight, speed, index = 0, total = 1) {
        this.rowIdx = rowIdx;
        this.y = rowIdx * ROW_HEIGHT + ROW_HEIGHT/2;
        this.isLeftToRight = isLeftToRight;
        this.speed = speed;
        this.dir = isLeftToRight ? 1 : -1;
        this.type = type; // 'car' or 'log'
        
        // Random dimensions & colors
        if (type === 'car') {
          this.width = 45 + Math.random() * 35; // width 45-80
          this.height = 24;
          const carColors = ['#ff00ff', '#ff5e00', '#00f2fe', '#39ff14', '#ffff00'];
          this.color = carColors[Math.floor(Math.random() * carColors.length)];
        } else {
          // Log (width adapts based on stage)
          const stage = getDifficulty(rowIdx).level;
          const baseLogWidth = stage >= 5 ? 55 : (stage === 4 ? 65 : 75);
          this.width = baseLogWidth + Math.random() * (stage >= 5 ? 30 : 45); // width 55-120
          this.height = 22;
          this.color = '#bf8a3d'; // glowing neon light brown/gold
        }

        // Evenly space out obstacles to prevent overlap
        const loopWidth = canvas.width + 240; // Spacing path from -120 to canvas.width + 120
        const segment = loopWidth / total;
        const jitter = (Math.random() - 0.5) * (type === 'car' ? 25 : 12);
        
        if (this.isLeftToRight) {
          this.x = -120 + index * segment + jitter;
        } else {
          this.x = canvas.width + 120 - index * segment + jitter;
        }
      }

      update(dt = 1) {
        this.x += this.speed * this.dir * dt;
        
        // Wrapping at fixed boundaries to preserve spacing perfectly
        if (this.dir === 1 && this.x > canvas.width + 120) {
          this.x = -120;
        } else if (this.dir === -1 && this.x < -120) {
          this.x = canvas.width + 120;
        }
      }

      draw() {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        
        const screenY = canvas.height - (this.y - cameraY);
        
        if (this.type === 'car') {
          // Draw Neon Car Box outline
          ctx.strokeRect(this.x, screenY - this.height/2, this.width, this.height);
          
          // Headlights glow
          ctx.beginPath();
          ctx.shadowBlur = 15;
          ctx.fillStyle = '#fff';
          if (this.dir === 1) {
            // Front is right
            ctx.arc(this.x + this.width, screenY - 6, 2.5, 0, Math.PI*2);
            ctx.arc(this.x + this.width, screenY + 6, 2.5, 0, Math.PI*2);
          } else {
            // Front is left
            ctx.arc(this.x, screenY - 6, 2.5, 0, Math.PI*2);
            ctx.arc(this.x, screenY + 6, 2.5, 0, Math.PI*2);
          }
          ctx.fill();
        } else {
          // Raft / Floating logs (3 wooden logs lashed together with glowing ropes)
          const logCount = 3;
          const logHeight = this.height / logCount;
          
          ctx.save();
          // Draw a soft glowing wood backdrop
          ctx.fillStyle = 'rgba(235, 160, 60, 0.1)';
          ctx.fillRect(this.x, screenY - this.height/2, this.width, this.height);
          
          // Draw each individual log of the raft
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 1.8;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          
          for (let i = 0; i < logCount; i++) {
            const ly = screenY - this.height/2 + i * logHeight + logHeight/2;
            
            // Draw log body
            ctx.strokeRect(this.x + 2, ly - logHeight/2 + 1, this.width - 4, logHeight - 2);
            
            // Draw inner wood grain lines
            ctx.beginPath();
            ctx.lineWidth = 0.8;
            ctx.moveTo(this.x + 12, ly);
            ctx.lineTo(this.x + this.width - 12, ly);
            ctx.stroke();
          }
          
          // Draw lashing ropes wrapping around the logs (neon white bands)
          ctx.strokeStyle = '#fff';
          ctx.shadowColor = '#fff';
          ctx.lineWidth = 2;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          // Left rope
          ctx.moveTo(this.x + 12, screenY - this.height/2 - 1);
          ctx.lineTo(this.x + 12, screenY + this.height/2 + 1);
          // Right rope
          ctx.moveTo(this.x + this.width - 12, screenY - this.height/2 - 1);
          ctx.lineTo(this.x + this.width - 12, screenY + this.height/2 + 1);
          ctx.stroke();
          
          // Draw trailing white wake water ripple (foam wave behind the log)
          ctx.strokeStyle = 'rgba(0, 242, 254, 0.45)';
          ctx.shadowColor = '#00f2fe';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          if (this.dir === 1) {
            // Moving right, trail is on the left
            ctx.moveTo(this.x - 4, screenY - this.height/2);
            ctx.quadraticCurveTo(this.x - 12, screenY, this.x - 4, screenY + this.height/2);
          } else {
            // Moving left, trail is on the right
            ctx.moveTo(this.x + this.width + 4, screenY - this.height/2);
            ctx.quadraticCurveTo(this.x + this.width + 12, screenY, this.x + this.width + 4, screenY + this.height/2);
          }
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }
    }

    // Lane Row definition
    class Row {
      constructor(idx) {
        this.idx = idx;
        this.y = idx * ROW_HEIGHT;
        this.type = 'safe'; // 'safe', 'road', 'river', 'rail'
        this.obstacles = [];
        this.item = null; // { col, type: 'heart'/'star'/'shield', collected: false, rot: 0 }
        
        const diff = getDifficulty(idx);
        const stage = diff.level;

        // Alert states for rail
        this.trainActive = false;
        this.trainX = -400;
        this.trainDirection = Math.random() < 0.5 ? 1 : -1;
        this.warningTimer = 0;
        this.warningActive = false;

        // Configure train speeds & intervals based on stage
        if (stage === 1) {
          this.trainSpeed = 13.0;
          this.timeToTrain = 360 + Math.random() * 240; // Very rare trains in Stage 1
        } else if (stage === 2) {
          this.trainSpeed = 16.5;
          this.timeToTrain = 180 + Math.random() * 160; // More trains in Stage 2
        } else if (stage === 3) {
          this.trainSpeed = 18.0;
          this.timeToTrain = 160 + Math.random() * 140;
        } else if (stage === 4) {
          this.trainSpeed = 20.5;
          this.timeToTrain = 130 + Math.random() * 110;
        } else {
          // Hardcore (Stage 5)
          this.trainSpeed = 24.0;
          this.timeToTrain = 85 + Math.random() * 90;
        }
        
        // Randomize row type based on stage specifications:
        // Ebene 1 (0-50m): Wenig Verkehr, KEIN Fluss, ganz selten ein Zug
        // Ebene 2 (51-100m): Mehr Züge, KEIN Fluss
        // Ebene 3 (101-200m): Flüsse eingeführt, Züge, Straßen
        // Ebene 4 (201-300m): Viel mehr Verkehr, Flüsse, Züge
        // Ebene 5 (301m+): Hardcore bis zum Ausscheiden
        if (idx > 2) {
          const r = Math.random();

          if (stage === 1) {
            // Stage 1: Safe 45%, Road 48%, Rail 7%, River 0%
            if (r < 0.45) {
              this.type = 'safe';
            } else if (r < 0.93) {
              this.type = 'road';
            } else {
              this.type = 'rail';
            }
          } else if (stage === 2) {
            // Stage 2: Safe 35%, Road 40%, Rail 25%, River 0%
            if (r < 0.35) {
              this.type = 'safe';
            } else if (r < 0.75) {
              this.type = 'road';
            } else {
              this.type = 'rail';
            }
          } else if (stage === 3) {
            // Stage 3: Safe 28%, Road 34%, River 24%, Rail 14%
            if (r < 0.28) {
              this.type = 'safe';
            } else if (r < 0.62) {
              this.type = 'road';
            } else if (r < 0.86) {
              this.type = 'river';
            } else {
              this.type = 'rail';
            }
          } else if (stage === 4) {
            // Stage 4: Safe 20%, Road 45%, River 20%, Rail 15%
            if (r < 0.20) {
              this.type = 'safe';
            } else if (r < 0.65) {
              this.type = 'road';
            } else if (r < 0.85) {
              this.type = 'river';
            } else {
              this.type = 'rail';
            }
          } else {
            // Stage 5 (Hardcore): Safe 15%, Road 48%, River 22%, Rail 15%
            if (r < 0.15) {
              this.type = 'safe';
            } else if (r < 0.63) {
              this.type = 'road';
            } else if (r < 0.85) {
              this.type = 'river';
            } else {
              this.type = 'rail';
            }
          }
        }

        // Safety rules:
        // 1. Prevent back-to-back train tracks
        if (this.type === 'rail' && rows[idx - 1] && rows[idx - 1].type === 'rail') {
          this.type = (stage >= 3 && Math.random() < 0.3) ? 'river' : 'safe';
        }

        // 2. Prevent too many consecutive rivers (max 2 in a row)
        if (this.type === 'river') {
          let consecutiveRivers = 0;
          for (let prevIdx = idx - 1; prevIdx >= idx - 2; prevIdx--) {
            if (rows[prevIdx] && rows[prevIdx].type === 'river') {
              consecutiveRivers++;
            }
          }
          if (consecutiveRivers >= 2) {
            this.type = 'safe';
          }
        }

        // 3. Prevent too many consecutive roads without rest
        const maxConsecutiveRoads = stage <= 3 ? 3 : 4;
        if (this.type === 'road') {
          let consecutiveRoads = 0;
          for (let prevIdx = idx - 1; prevIdx >= idx - maxConsecutiveRoads; prevIdx--) {
            if (rows[prevIdx] && rows[prevIdx].type === 'road') {
              consecutiveRoads++;
            }
          }
          if (consecutiveRoads >= maxConsecutiveRoads) {
            this.type = 'safe';
          }
        }

        // Initialize obstacles for road/river based on Stage
        if (this.type === 'road') {
          const isLeftToRight = Math.random() < 0.5;
          let laneSpeed = 1.0;
          let carCount = 2;

          if (stage === 1) {
            laneSpeed = 0.95 + Math.random() * 0.45;
            carCount = Math.random() < 0.7 ? 1 : 2; // 1-2 slow cars
          } else if (stage === 2) {
            laneSpeed = 1.35 + Math.random() * 0.6;
            carCount = 2;
          } else if (stage === 3) {
            laneSpeed = 1.65 + Math.random() * 0.7;
            carCount = Math.random() < 0.5 ? 2 : 3;
          } else if (stage === 4) {
            laneSpeed = 2.25 + Math.random() * 0.9;
            carCount = Math.random() < 0.35 ? 2 : 3;
          } else {
            // Stage 5 Hardcore
            laneSpeed = 2.85 + Math.random() * 1.35;
            carCount = 3;
          }

          for (let i = 0; i < carCount; i++) {
            this.obstacles.push(new Obstacle(idx, 'car', isLeftToRight, laneSpeed, i, carCount));
          }
        } else if (this.type === 'river') {
          const isLeftToRight = Math.random() < 0.5;
          let laneSpeed = 0.85;
          let logCount = 3;

          if (stage <= 3) {
            laneSpeed = 0.85 + Math.random() * 0.5;
            logCount = 3;
          } else if (stage === 4) {
            laneSpeed = 1.25 + Math.random() * 0.7;
            logCount = 3;
          } else {
            // Stage 5 Hardcore
            laneSpeed = 1.75 + Math.random() * 0.9;
            logCount = Math.random() < 0.5 ? 3 : 2;
          }

          for (let i = 0; i < logCount; i++) {
            this.obstacles.push(new Obstacle(idx, 'log', isLeftToRight, laneSpeed, i, logCount));
          }
        }

        // Spawning Collectibles in Safe rows
        if (this.type === 'safe' && idx > 2 && Math.random() < 0.28) {
          const types = ['star', 'star', 'star', 'heart', 'shield'];
          const randType = types[Math.floor(Math.random() * types.length)];
          this.item = {
            col: Math.floor(Math.random() * GRID_COLS),
            type: randType,
            collected: false,
            rot: Math.random() * Math.PI
          };
        }
      }

      update(dt = 1) {
        // Update regular obstacles
        this.obstacles.forEach(obs => obs.update(dt));

        // Update items (rotation)
        if (this.item && !this.item.collected) {
          this.item.rot += 0.035 * dt;
        }

        // Rail Row train logistics
        if (this.type === 'rail') {
          if (!this.trainActive) {
            this.timeToTrain -= dt;
            if (this.timeToTrain <= 85) {
              const wasWarning = this.warningActive;
              this.warningActive = true;
              this.warningTimer += dt;
              // Play authentic railroad signal "ding ding-ding" bell
              if (!wasWarning || (this.warningTimer >= 42 && this.warningTimer - dt < 42)) {
                soundManager.playTrainWarning();
              }
            }
            if (this.timeToTrain <= 0) {
              this.trainActive = true;
              this.warningActive = false;
              this.warningTimer = 0;
              // Reset train pos
              this.trainX = this.trainDirection === 1 ? -600 : canvas.width + 100;
            }
          } else {
            // Train is active
            this.trainX += this.trainSpeed * this.trainDirection * dt;
            
            // Check if train is off-screen
            if ((this.trainDirection === 1 && this.trainX > canvas.width + 200) ||
                (this.trainDirection === -1 && this.trainX < -700)) {
              this.trainActive = false;
              this.timeToTrain = 250 + Math.random() * 250 - Math.min(100, this.idx * 0.8);
            }
          }
        }
      }

      draw() {
        // Draw Lane background & bounds
        ctx.save();
        const screenYCenter = canvas.height - (this.y + ROW_HEIGHT/2 - cameraY);
        
        if (this.type === 'safe') {
          // Grass dark green-blue lane
          ctx.fillStyle = '#06130d';
          ctx.fillRect(0, screenYCenter - ROW_HEIGHT/2, canvas.width, ROW_HEIGHT);
          
          // Glowing green lane borders
          ctx.strokeStyle = '#39ff14';
          ctx.shadowColor = '#39ff14';
          ctx.shadowBlur = 6;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, screenYCenter - ROW_HEIGHT/2);
          ctx.lineTo(canvas.width, screenYCenter - ROW_HEIGHT/2);
          ctx.stroke();
          
          // Draw tiny green grid ticks
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(57, 255, 20, 0.12)';
          ctx.lineWidth = 0.8;
          for (let c = 1; c < GRID_COLS; c++) {
            ctx.beginPath();
            ctx.moveTo(c * COL_WIDTH, screenYCenter - ROW_HEIGHT/2);
            ctx.lineTo(c * COL_WIDTH, screenYCenter + ROW_HEIGHT/2);
            ctx.stroke();
          }

          // Draw random glowing vector grass clumps (2 per safe lane)
          ctx.save();
          ctx.strokeStyle = '#39ff14';
          ctx.shadowColor = '#39ff14';
          ctx.shadowBlur = 5;
          ctx.lineWidth = 1.5;
          for (let i = 0; i < 2; i++) {
            // Seeded deterministic positions based on row index
            const gx = ((this.idx * 133 + i * 187) % (canvas.width - 40)) + 20;
            const gy = this.y + ROW_HEIGHT - 12 - ((this.idx * 47 + i * 29) % 12);
            const screenGy = canvas.height - (gy - cameraY);
            
            // Draw dual blade grass vector clump
            ctx.beginPath();
            ctx.moveTo(gx - 3, screenGy + 4);
            ctx.lineTo(gx - 1, screenGy - 3);
            ctx.lineTo(gx, screenGy + 4);
            ctx.moveTo(gx, screenGy + 4);
            ctx.lineTo(gx + 2, screenGy - 4);
            ctx.stroke();
          }
          ctx.restore();
        } else if (this.type === 'road') {
          // Asphalt road with neon borders
          ctx.fillStyle = '#060812';
          ctx.fillRect(0, screenYCenter - ROW_HEIGHT/2, canvas.width, ROW_HEIGHT);
          
          // Outer borders (neon pink)
          ctx.strokeStyle = 'rgba(255, 0, 127, 0.38)';
          ctx.shadowColor = 'rgba(255, 0, 127, 0.4)';
          ctx.shadowBlur = 6;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(0, screenYCenter - ROW_HEIGHT/2);
          ctx.lineTo(canvas.width, screenYCenter - ROW_HEIGHT/2);
          ctx.moveTo(0, screenYCenter + ROW_HEIGHT/2);
          ctx.lineTo(canvas.width, screenYCenter + ROW_HEIGHT/2);
          ctx.stroke();
          
          // Dashed lane marker (neon yellow)
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255, 255, 0, 0.22)';
          ctx.setLineDash([12, 12]);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, screenYCenter);
          ctx.lineTo(canvas.width, screenYCenter);
          ctx.stroke();
        } else if (this.type === 'river') {
          // Neon river lane: deep blue-cyan gradient
          const riverGrad = ctx.createLinearGradient(0, screenYCenter - ROW_HEIGHT/2, 0, screenYCenter + ROW_HEIGHT/2);
          riverGrad.addColorStop(0, '#001330');
          riverGrad.addColorStop(0.5, '#00081c');
          riverGrad.addColorStop(1, '#001330');
          ctx.fillStyle = riverGrad;
          ctx.fillRect(0, screenYCenter - ROW_HEIGHT/2, canvas.width, ROW_HEIGHT);
          
          // Bright cyan glowing river borders
          ctx.strokeStyle = '#0088ff';
          ctx.shadowColor = '#0088ff';
          ctx.shadowBlur = 8;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, screenYCenter - ROW_HEIGHT/2);
          ctx.lineTo(canvas.width, screenYCenter - ROW_HEIGHT/2);
          ctx.moveTo(0, screenYCenter + ROW_HEIGHT/2);
          ctx.lineTo(canvas.width, screenYCenter + ROW_HEIGHT/2);
          ctx.stroke();
          
          // Animated flowing horizontal water waves
          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(0, 242, 254, 0.25)';
          ctx.lineWidth = 1.2;
          const scroll = (Date.now() * 0.045) % 90;
          ctx.beginPath();
          // Wave 1 flowing right
          ctx.moveTo(-90 + scroll, screenYCenter - 10);
          for (let x = -90; x <= canvas.width + 90; x += 30) {
            ctx.lineTo(x + scroll, screenYCenter - 10 + Math.sin((x + scroll) * 0.05) * 3);
          }
          // Wave 2 flowing left
          ctx.moveTo(canvas.width + 90 - scroll, screenYCenter + 10);
          for (let x = canvas.width + 90; x >= -90; x -= 30) {
            ctx.lineTo(x - scroll, screenYCenter + 10 + Math.cos((x - scroll) * 0.05) * 3);
          }
          ctx.stroke();

          // Draw little floating water circles/bubbles
          ctx.fillStyle = 'rgba(0, 242, 254, 0.15)';
          const bubbleTime = Date.now() * 0.002;
          for (let i = 0; i < 3; i++) {
            const bx = ((this.idx * 79 + i * 115) + bubbleTime * 35) % (canvas.width + 40) - 20;
            const by = screenYCenter - ROW_HEIGHT/2 + 8 + (i * 11);
            ctx.beginPath();
            ctx.arc(bx, by, 1.2 + Math.sin(bubbleTime + i) * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (this.type === 'rail') {
          // Train tracks
          ctx.fillStyle = '#0f0f16';
          ctx.fillRect(0, screenYCenter - ROW_HEIGHT/2, canvas.width, ROW_HEIGHT);
          
          // Rail beds (sleepers)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
          ctx.lineWidth = 3.5;
          for (let i = 8; i < canvas.width; i += 20) {
            ctx.beginPath();
            ctx.moveTo(i, screenYCenter - ROW_HEIGHT/2 + 6);
            ctx.lineTo(i, screenYCenter + ROW_HEIGHT/2 - 6);
            ctx.stroke();
          }
          
          // Rails themselves
          ctx.strokeStyle = '#4e5b70';
          ctx.lineWidth = 3.0;
          ctx.beginPath();
          ctx.moveTo(0, screenYCenter - ROW_HEIGHT/2 + 8);
          ctx.lineTo(canvas.width, screenYCenter - ROW_HEIGHT/2 + 8);
          ctx.moveTo(0, screenYCenter + ROW_HEIGHT/2 - 8);
          ctx.lineTo(canvas.width, screenYCenter + ROW_HEIGHT/2 - 8);
          ctx.stroke();

          // Railroad warning crosses drawn at the sides (yellow vector X)
          ctx.save();
          ctx.strokeStyle = '#ffff00';
          ctx.shadowColor = '#ffff00';
          ctx.shadowBlur = 6;
          ctx.lineWidth = 2;
          const drawCross = (cx, cy) => {
            ctx.beginPath();
            ctx.moveTo(cx - 5, cy - 5);
            ctx.lineTo(cx + 5, cy + 5);
            ctx.moveTo(cx + 5, cy - 5);
            ctx.lineTo(cx - 5, cy + 5);
            ctx.stroke();
          };
          drawCross(15, screenYCenter);
          drawCross(canvas.width - 15, screenYCenter);
          ctx.restore();
          
          // Warning indicator light
          if (this.warningActive) {
            const glowPulse = Math.abs(Math.sin(Date.now() * 0.015));
            ctx.beginPath();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff003c';
            ctx.fillStyle = `rgba(255, 0, 60, ${0.3 + glowPulse * 0.7})`;
            // Left light
            ctx.arc(20, screenYCenter, 8, 0, Math.PI*2);
            // Right light
            ctx.arc(canvas.width - 20, screenYCenter, 8, 0, Math.PI*2);
            ctx.fill();
          }
        }
        ctx.restore();

        // Draw logs/vehicles
        this.obstacles.forEach(obs => obs.draw());

        // Draw train
        if (this.type === 'rail' && this.trainActive) {
          ctx.save();
          ctx.fillStyle = 'rgba(255, 0, 60, 0.9)';
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#ff003c';
          
          // Super long futuristic cargo train laser outline
          ctx.fillRect(this.trainX, screenYCenter - (ROW_HEIGHT - 8)/2, 480, ROW_HEIGHT - 8);
          ctx.strokeRect(this.trainX, screenYCenter - (ROW_HEIGHT - 8)/2, 480, ROW_HEIGHT - 8);
          
          // Cab windows
          ctx.fillStyle = '#00f2fe';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00f2fe';
          if (this.trainDirection === 1) {
            ctx.fillRect(this.trainX + 460, screenYCenter - (ROW_HEIGHT - 16)/2, 12, ROW_HEIGHT - 16);
          } else {
            ctx.fillRect(this.trainX + 8, screenYCenter - (ROW_HEIGHT - 16)/2, 12, ROW_HEIGHT - 16);
          }
          ctx.restore();
        }

        // Draw Collectible
        if (this.item && !this.item.collected) {
          ctx.save();
          const itemX = this.item.col * COL_WIDTH + COL_WIDTH/2;
          const itemY = screenYCenter;
          
          ctx.translate(itemX, itemY);
          ctx.rotate(this.item.rot);
          
          if (this.item.type === 'star') {
            ctx.strokeStyle = '#ffff00';
            ctx.fillStyle = 'rgba(255, 255, 0, 0.15)';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 10, -Math.sin((18 + i * 72) * Math.PI / 180) * 10);
              ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 5, -Math.sin((54 + i * 72) * Math.PI / 180) * 5);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (this.item.type === 'heart') {
            ctx.strokeStyle = '#ff0055';
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 2;
            
            const pulse = 1.0 + Math.sin(Date.now() * 0.01) * 0.1;
            ctx.scale(pulse, pulse);
            
            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.bezierCurveTo(-8, -2, -8, -10, 0, -6);
            ctx.bezierCurveTo(8, -10, 8, -2, 0, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (this.item.type === 'shield') {
            const pulse = 1.0 + Math.sin(Date.now() * 0.008) * 0.12;
            ctx.scale(pulse, pulse);

            // Outer spinning cyber aura (hexagonal ring)
            ctx.save();
            ctx.rotate(-this.item.rot * 1.5);
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = (i * 60) * Math.PI / 180;
              const hx = Math.cos(a) * 14;
              const hy = Math.sin(a) * 14;
              if (i === 0) ctx.moveTo(hx, hy);
              else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // Main Shield Crest Silhouette
            ctx.strokeStyle = '#00ffff';
            ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.lineWidth = 2.4;

            ctx.beginPath();
            ctx.moveTo(-9, -9);
            ctx.quadraticCurveTo(0, -12, 9, -9); // Top curved arch
            ctx.lineTo(9, 1);
            ctx.quadraticCurveTo(9, 10, 0, 14);  // Right downward curve to point
            ctx.quadraticCurveTo(-9, 10, -9, 1); // Left downward curve to point
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner Shield Core (Glowing white emblem)
            ctx.strokeStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 1.8;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';

            ctx.beginPath();
            ctx.moveTo(-4, -4);
            ctx.lineTo(4, -4);
            ctx.lineTo(4, 0);
            ctx.lineTo(0, 7);
            ctx.lineTo(-4, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();
        }
      }
    }

    // Player logic (Neon Chicken)
    class NeonChicken {
      constructor() {
        this.col = 4;
        this.row = 1;
        this.targetX = this.col * COL_WIDTH + COL_WIDTH/2;
        this.targetY = this.row * ROW_HEIGHT + ROW_HEIGHT/2;
        
        this.x = this.targetX;
        this.y = this.targetY;
        
        this.radius = 12;
        this.hopTimer = 0;
        this.hopMaxFrames = 10;
        this.facing = 'up'; // 'up', 'down', 'left', 'right'
        this.angle = 0; // Current rendered rotation angle
        this.targetAngle = 0; // Target facing rotation angle
        
        // Invincibility state
        this.shieldTime = 0; // frames
        this.blinkTimer = 0;
        this.invulnerableTimer = 0; // post hit invincibility
      }

      move(dir) {
        if (gameState !== 'playing' || this.hopTimer > 0) return;
        
        // Realign column index based on floating x position if on a river
        const currentRow = rows[this.row];
        if (currentRow && currentRow.type === 'river') {
          this.col = Math.max(0, Math.min(GRID_COLS - 1, Math.round((this.x - COL_WIDTH / 2) / COL_WIDTH)));
        }

        let newCol = this.col;
        let newRow = this.row;
        this.facing = dir;

        if (dir === 'up') {
          newRow++;
          this.targetAngle = 0;
        } else if (dir === 'down') {
          newRow--;
          this.targetAngle = Math.PI;
        } else if (dir === 'left') {
          newCol--;
          this.targetAngle = -Math.PI / 2;
        } else if (dir === 'right') {
          newCol++;
          this.targetAngle = Math.PI / 2;
        }

        // Left-Right clamps
        if (newCol < 0 || newCol >= GRID_COLS) return;
        
        // Lower limit (cannot go below row 0)
        if (newRow < 0) return;

        // Valid move! Initiate hop
        this.col = newCol;
        this.row = newRow;
        this.targetX = this.col * COL_WIDTH + COL_WIDTH/2;
        this.targetY = this.row * ROW_HEIGHT + ROW_HEIGHT/2;
        
        this.hopTimer = this.hopMaxFrames;
        totalHops++;
        
        soundManager.playHop();

        // Spawn hop particles
        for (let i = 0; i < 5; i++) {
          particles.push(new SparkParticle(this.x, this.y, '#ffff00'));
        }

        // Keep track of score metrics & stage progression
        const distanceForward = Math.max(0, this.row - 1);
        if (distanceForward > maxRowReached) {
          const oldDiff = getDifficulty(score);
          maxRowReached = distanceForward;
          score = maxRowReached + bonusPoints;
          const newDiff = getDifficulty(score);

          // Celebration when advancing to next stage
          if (newDiff.level > oldDiff.level) {
            levelGlowTimer = 90;
            soundManager.playCoin();
            for (let i = 0; i < 20; i++) {
              particles.push(new SparkParticle(this.x, this.y, newDiff.badgeColor));
            }
          }
        }
      }

      update(dt = 1) {
        // Interpolate position smoothly
        if (this.hopTimer > 0) {
          this.hopTimer = Math.max(0, this.hopTimer - dt);
        }
        
        // Frame-rate independent exponential smoothing (ultra-fluid 120Hz/60Hz)
        const moveSmoothing = 1 - Math.pow(0.72, dt);
        this.x += (this.targetX - this.x) * moveSmoothing;
        this.y += (this.targetY - this.y) * moveSmoothing;

        // Smooth rotation angle interpolation (shortest angular distance)
        let diff = this.targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        const rotSmoothing = 1 - Math.pow(0.62, dt);
        this.angle += diff * rotSmoothing;

        // Timers
        if (this.shieldTime > 0) this.shieldTime = Math.max(0, this.shieldTime - dt);
        if (this.invulnerableTimer > 0) this.invulnerableTimer = Math.max(0, this.invulnerableTimer - dt);
        this.blinkTimer += dt;

        // River log carry logic
        const currentRow = rows[this.row];
        if (currentRow && currentRow.type === 'river' && this.hopTimer <= 0.1) {
          let onLog = false;
          let logCarrier = null;

          currentRow.obstacles.forEach(log => {
            if (this.x >= log.x - 5 && this.x <= log.x + log.width + 5) {
              onLog = true;
              logCarrier = log;
            }
          });

          if (onLog && logCarrier) {
            // Carry player with log speed
            const shift = logCarrier.speed * logCarrier.dir * dt;
            this.targetX += shift;
            this.x += shift;
            
            // Continuous column tracking while floating
            this.col = Math.max(0, Math.min(GRID_COLS - 1, Math.round((this.x - COL_WIDTH / 2) / COL_WIDTH)));
            
            // Check off-screen river boundaries
            if (this.x < 0 || this.x > canvas.width) {
              this.die('river');
            }
          } else {
            // Drowned in river
            this.die('river');
          }
        }
      }

      die(reason) {
        if (this.shieldTime > 0 || this.invulnerableTimer > 0) return; // Immune

        lives--;
        if (lives <= 0) {
          // Explode particle splash
          for (let i = 0; i < 28; i++) {
            particles.push(new SparkParticle(this.x, this.y, '#ff003c'));
          }
          triggerGameOver();
        } else {
          // Lose 1 life but respawn / get invulnerable frames
          soundManager.playCrash();
          this.invulnerableTimer = 90; // 1.5s invulnerable
          
          if (reason === 'river') {
            soundManager.playSplash();
            // Reset back to nearest safe row
            let safeRow = this.row;
            while (safeRow > 0 && (!rows[safeRow] || rows[safeRow].type === 'river')) {
              safeRow--;
            }
            this.row = safeRow;
            this.col = 4;
            this.targetX = this.col * COL_WIDTH + COL_WIDTH/2;
            this.targetY = this.row * ROW_HEIGHT + ROW_HEIGHT/2;
            this.x = this.targetX;
            this.y = this.targetY;
          } else {
            // Knock back slightly
            this.row = Math.max(0, this.row - 1);
            this.targetY = this.row * ROW_HEIGHT + ROW_HEIGHT/2;
          }
          
          // Spawn feedback particles
          for (let i = 0; i < 15; i++) {
            particles.push(new SparkParticle(this.x, this.y, '#ff00ff'));
          }
        }
      }

      draw() {
        // Flashing visibility if invulnerable
        if (this.invulnerableTimer > 0 && Math.floor(this.blinkTimer / 5) % 2 === 0) {
          return;
        }

        ctx.save();
        
        // Calculate hop jump offset for visual height
        let jumpHeight = 0;
        if (this.hopTimer > 0) {
          // parabolic arch path
          const progress = 1.0 - (this.hopTimer / this.hopMaxFrames);
          jumpHeight = Math.sin(progress * Math.PI) * 15;
        }

        // Invert Y coordinate
        const screenYGround = canvas.height - (this.y - cameraY);
        const screenYChicken = canvas.height - (this.y + jumpHeight - cameraY);

        // Draw shadow under chicken (centered circular shadow)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        const shadowRadius = Math.max(5, this.radius - jumpHeight * 0.35);
        ctx.arc(this.x, screenYGround, shadowRadius, 0, Math.PI * 2);
        ctx.fill();

        // Translate to animated position
        ctx.translate(this.x, screenYChicken);

        // Smooth rotation angle around center axis
        ctx.rotate(this.angle);

        // Hop squash & stretch in movement direction
        if (this.hopTimer > 0) {
          const hopP = 1.0 - (this.hopTimer / this.hopMaxFrames);
          const stretchY = 1.0 + Math.sin(hopP * Math.PI) * 0.16;
          const stretchX = 1.0 - Math.sin(hopP * Math.PI) * 0.10;
          ctx.scale(stretchX, stretchY);
        }

        // Glowing animated forcefield shield bubble if active
        if (this.shieldTime > 0) {
          ctx.save();
          const shieldPulse = Math.sin(Date.now() * 0.012) * 1.5;
          ctx.strokeStyle = '#00f2fe';
          ctx.fillStyle = 'rgba(0, 242, 254, 0.2)';
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#00f2fe';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8 + shieldPulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Hexagonal forcefield outline
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.lineWidth = 1.2;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#fff';
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i * 60 + (Date.now() * 0.04)) * Math.PI / 180;
            const hx = Math.cos(a) * (this.radius + 9);
            const hy = Math.sin(a) * (this.radius + 9);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        // ==========================================
        // TOP-DOWN CYBER NEON CHICKEN (PERFECTLY CENTERED ROTATION)
        // ==========================================
        const isHopping = jumpHeight > 0;
        const wingSpread = isHopping ? 2.5 : 0;

        ctx.save();

        // 1. NEON FEET (Visible when hopping or at rear)
        if (isHopping) {
          ctx.save();
          ctx.strokeStyle = '#ff7700';
          ctx.fillStyle = 'rgba(255, 119, 0, 0.35)';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff7700';
          ctx.lineWidth = 1.6;

          // Left Foot
          ctx.strokeRect(-7, 7, 4.5, 4.5);
          ctx.fillRect(-7, 7, 4.5, 4.5);

          // Right Foot
          ctx.strokeRect(2.5, 7, 4.5, 4.5);
          ctx.fillRect(2.5, 7, 4.5, 4.5);
          ctx.restore();
        }

        // 2. NEON WINGS (Symmetrical Cyan Side Rectangles)
        ctx.save();
        ctx.strokeStyle = '#00f2fe';
        ctx.fillStyle = 'rgba(0, 242, 254, 0.22)';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f2fe';
        ctx.lineWidth = 2.0;

        // Left Wing
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-12.5 - wingSpread, -4, 4, 8, 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-12.5 - wingSpread, -4, 4, 8);
          ctx.strokeRect(-12.5 - wingSpread, -4, 4, 8);
        }

        // Right Wing
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(8.5 + wingSpread, -4, 4, 8, 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(8.5 + wingSpread, -4, 4, 8);
          ctx.strokeRect(8.5 + wingSpread, -4, 4, 8);
        }
        ctx.restore();

        // 3. MAIN BODY (Symmetrical Blocky Cyber Silhouette in Glowing Neon Yellow)
        ctx.save();
        ctx.strokeStyle = '#ffff00'; // Neon Yellow
        ctx.fillStyle = '#060a17';   // Deep Cyber Dark Core
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ffff00';
        ctx.lineWidth = 2.4;

        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-8.5, -8.5, 17, 17, 4);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-8.5, -8.5, 17, 17);
          ctx.strokeRect(-8.5, -8.5, 17, 17);
        }

        // Inner glowing cyber circuit accent
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)';
        ctx.lineWidth = 1.0;
        ctx.shadowBlur = 4;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-5.5, -5.5, 11, 11, 2);
          ctx.stroke();
        }
        ctx.restore();

        // 4. NEON PINK HEAD COMB (Kamm on top edge)
        ctx.save();
        ctx.strokeStyle = '#ff007f';
        ctx.fillStyle = 'rgba(255, 0, 127, 0.4)';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ff007f';
        ctx.lineWidth = 2.0;

        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-3, -8.5, 6, 6, 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-3, -8.5, 6, 6);
          ctx.strokeRect(-3, -8.5, 6, 6);
        }
        ctx.restore();

        // 5. NEON ORANGE BEAK & PINK WATTLE (Front Schnabel)
        ctx.save();
        // Pink Wattle under beak
        ctx.strokeStyle = '#ff007f';
        ctx.fillStyle = 'rgba(255, 0, 127, 0.5)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff007f';
        ctx.lineWidth = 1.6;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-2.5, -11.5, 5, 3, 1.5);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-2.5, -11.5, 5, 3);
          ctx.strokeRect(-2.5, -11.5, 5, 3);
        }

        // Orange Beak Block
        ctx.strokeStyle = '#ff7700';
        ctx.fillStyle = 'rgba(255, 119, 0, 0.45)';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff7700';
        ctx.lineWidth = 2.0;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(-3.5, -14.5, 7, 5, 1.5);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(-3.5, -14.5, 7, 5);
          ctx.strokeRect(-3.5, -14.5, 7, 5);
        }
        ctx.restore();

        // 6. NEON EYES (Twin glowing cyber dots)
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f2fe';
        ctx.fillRect(-6, -5.5, 2.5, 2.5);
        ctx.fillRect(3.5, -5.5, 2.5, 2.5);
        ctx.restore();

        ctx.restore();
        ctx.restore();
        ctx.restore();
      }
    }

    // Dynamic infinite level row manager
    function getOrCreateRow(rowIdx) {
      if (!rows[rowIdx]) {
        rows[rowIdx] = new Row(rowIdx);
      }
      return rows[rowIdx];
    }

    // Populate rows initially
    function initRows() {
      rows = {};
      // Pad behind player
      for (let i = -5; i <= 16; i++) {
        // Enforce safety at start rows
        if (i <= 2) {
          const row = new Row(i);
          row.type = 'safe';
          row.item = null;
          rows[i] = row;
        } else {
          getOrCreateRow(i);
        }
      }
    }

    function initGame() {
      player = new NeonChicken();
      initRows();
      particles = [];
      score = 0;
      maxRowReached = 0;
      bonusPoints = 0;
      lives = 3;
      cameraY = 0;
      totalHops = 0;
      levelGlowTimer = 0;
      roundStartTime = Date.now();
      hasRevived = false;
      reviveCountdown = 0;
      reviveShieldTimer = 0;
      if (reviveCountdownTimer) {
        clearInterval(reviveCountdownTimer);
        reviveCountdownTimer = null;
      }
      if (reviveBtn) reviveBtn.style.display = 'none';
      
      // Show virtual dpad for touch users
      if ('ontouchstart' in window) {
        dpad.style.display = 'grid';
      }
    }

    function update(dt = 1) {
      if (gameState === 'revive_countdown') {
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.alpha > 0);
        return;
      }

      player.update(dt);

      // Dynamically generate rows ahead and delete rows far behind camera
      const currentMinRow = Math.floor(cameraY / ROW_HEIGHT) - 6;
      const currentMaxRow = Math.floor((cameraY + canvas.height) / ROW_HEIGHT) + 6;
      
      // Clean up old rows
      Object.keys(rows).forEach(key => {
        const idx = parseInt(key, 10);
        if (idx < currentMinRow) {
          delete rows[key];
        }
      });

      // Generate new rows
      for (let i = currentMinRow; i <= currentMaxRow; i++) {
        getOrCreateRow(i);
      }

      // Update rows with dt
      Object.values(rows).forEach(row => row.update(dt));

      // Update particles with dt
      particles.forEach(p => p.update(dt));
      particles = particles.filter(p => p.alpha > 0);

      // Smooth camera follow target row (frame-rate independent)
      const cameraTargetY = (player.row * ROW_HEIGHT) - 340;
      // Scroll camera smoothly, never scrolling back downwards
      if (cameraTargetY > cameraY) {
        const camSmoothing = 1 - Math.pow(0.88, dt);
        cameraY += (cameraTargetY - cameraY) * camSmoothing;
      }

      // Check if player falls off bottom of the screen (slow speed death)
      if (player.y - cameraY < 15) {
        player.die('fallsOff');
      }

      // Check collision with items
      const currentRow = rows[player.row];
      if (currentRow && currentRow.item && !currentRow.item.collected && player.hopTimer === 0) {
        const itemX = currentRow.item.col * COL_WIDTH + COL_WIDTH/2;
        if (Math.abs(player.x - itemX) < 18) {
          // Collected!
          currentRow.item.collected = true;
          const type = currentRow.item.type;
          
          if (type === 'star') {
            bonusPoints += 5; // Each star grants +5 bonus points
            const oldDiff = getDifficulty(score);
            score = maxRowReached + bonusPoints;
            const newDiff = getDifficulty(score);

            if (newDiff.level > oldDiff.level) {
              levelGlowTimer = 90;
              for (let i = 0; i < 20; i++) {
                particles.push(new SparkParticle(player.x, player.y, newDiff.badgeColor));
              }
            }

            soundManager.playCoin();
            // Golden spark explosion
            for (let i = 0; i < 14; i++) {
              particles.push(new SparkParticle(player.x, player.y, '#ffff00'));
            }
          } else if (type === 'heart') {
            lives = Math.min(maxLives, lives + 1);
            soundManager.playPowerup();
            // Heart spark explosion
            for (let i = 0; i < 16; i++) {
              particles.push(new SparkParticle(player.x, player.y, '#ff0055'));
            }
          } else if (type === 'shield') {
            player.shieldTime = 420; // 7 seconds cyber shield
            soundManager.playShield();
            // Cyan spark explosion
            for (let i = 0; i < 18; i++) {
              particles.push(new SparkParticle(player.x, player.y, '#00ffff'));
            }
          }
        }
      }

      // Check collision with obstacles (cars, train) on current row
      if (currentRow && player.hopTimer === 0) {
        // Cars collision check
        if (currentRow.type === 'road') {
          currentRow.obstacles.forEach(car => {
            const playerLeft = player.x - player.radius + 2;
            const playerRight = player.x + player.radius - 2;
            const carLeft = car.x;
            const carRight = car.x + car.width;
            
            if (playerRight > carLeft && playerLeft < carRight) {
              if (player.shieldTime > 0) {
                // Destroy car!
                soundManager.playCrash();
                // Spawn car scrap particles
                for (let i = 0; i < 14; i++) {
                  particles.push(new SparkParticle(car.x + car.width/2, car.y, car.color));
                }
                // Push car off-screen so it resets
                car.x = car.dir === 1 ? canvas.width + 100 : -car.width - 100;
              } else {
                player.die('car');
              }
            }
          });
        }
        
        // Train collision check
        if (currentRow.type === 'rail' && currentRow.trainActive) {
          const playerLeft = player.x - player.radius + 3;
          const playerRight = player.x + player.radius - 3;
          const trainLeft = currentRow.trainX;
          const trainRight = currentRow.trainX + 480;
          
          if (playerRight > trainLeft && playerLeft < trainRight) {
            player.die('train');
          }
        }
      }
    }

    function draw() {
      // Clear with dark space backdrop
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Frustum culling: only draw rows currently inside visible screen + margin
      const minVisibleY = cameraY - ROW_HEIGHT * 2;
      const maxVisibleY = cameraY + canvas.height + ROW_HEIGHT * 2;

      Object.values(rows).forEach(row => {
        if (row.y >= minVisibleY && row.y <= maxVisibleY) {
          row.draw();
        }
      });

      // Draw player
      player.draw();

      // Draw particles
      particles.forEach(p => p.draw());

      // DRAW IN-GAME HEADS-UP DISPLAY (HUD)
      // 1. Draw Lives (Neon Red hearts on top LEFT, away from audio controls)
      ctx.save();
      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(255, 0, 85, 0.7)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff0055';
      ctx.font = '16px "Outfit", sans-serif';
      let heartsStr = '';
      for (let i = 0; i < lives; i++) {
        heartsStr += '❤️ ';
      }
      ctx.fillText(heartsStr, 14, 26);
      ctx.restore();

      // 2. Top Centered Glowing Score & Highscore HUD (matching Neon Bird & Doodle Jump)
      const displayHighscore = Math.max(savedHighscore, score);
      const isNewRecord = score > savedHighscore && savedHighscore > 0;

      ctx.save();
      ctx.textAlign = 'center';

      // Highscore Display (Positioned ABOVE current score, in Gold)
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(251, 191, 36, 0.4)';
      ctx.fillStyle = '#fbbf24'; // Gold
      ctx.font = isNewRecord ? '800 11px "Outfit", monospace' : '700 10px "Outfit", monospace';
      ctx.letterSpacing = '0.5px';
      const hsPrefix = isNewRecord ? (t.newRecordPrefix || '🔥 Rekord: ') : (t.highscorePrefix || '🏆 Highscore: ');
      ctx.fillText(`${hsPrefix}${displayHighscore.toLocaleString()}`, canvas.width / 2, 20);

      // Live Points Score
      ctx.fillStyle = '#00f2fe';
      ctx.font = '900 28px "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(0, 242, 254, 0.5)';
      ctx.fillText(score.toLocaleString(), canvas.width / 2, 48);

      // 3. Stage Level Badge (matching Neon Bird & Doodle Jump)
      const diff = getDifficulty(score);
      if (levelGlowTimer > 0) {
        levelGlowTimer--;
        ctx.shadowBlur = 14;
        ctx.shadowColor = diff.badgeColor;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = diff.badgeColor;
      ctx.font = '700 9.5px "Outfit", monospace';
      ctx.letterSpacing = '1px';
      ctx.fillText(`${diff.levelName} • ${diff.sectorName}`, canvas.width / 2, 63);
      ctx.restore();

      // 4. Shield Invulnerability Timeline Bar (Floating Top Countdown)
      if (player && player.shieldTime > 0) {
        const shieldRatio = player.shieldTime / 300; // 0.0 to 1.0 (5.0 seconds)
        const secondsLeft = (player.shieldTime / 60).toFixed(1);
        const barWidth = 140;
        const barHeight = 8;
        const barX = (canvas.width - barWidth) / 2;
        const barY = 78;

        ctx.save();
        // Pulsing warning if less than 1.2s remaining
        const isExpiring = player.shieldTime < 72;
        const shieldColor = (isExpiring && Math.floor(player.shieldTime / 6) % 2 === 0) ? '#ffea00' : '#00f2fe';

        // Outer glow & container
        ctx.shadowBlur = 12;
        ctx.shadowColor = shieldColor;

        // Background track pill
        ctx.fillStyle = 'rgba(5, 15, 25, 0.85)';
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(barX - 20, barY - 2, barWidth + 40, barHeight + 4, 6);
        else ctx.rect(barX - 20, barY - 2, barWidth + 40, barHeight + 4);
        ctx.fill();
        ctx.stroke();

        // Fill Progress Bar
        const fillW = Math.max(0, barWidth * shieldRatio);
        ctx.fillStyle = shieldColor;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(barX, barY, fillW, barHeight, 3);
        else ctx.rect(barX, barY, fillW, barHeight);
        ctx.fill();

        // Shield Icon & Timer Text
        ctx.font = '800 10px "Outfit", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'right';
        ctx.fillText('🛡️', barX - 4, barY + 7.5);
        ctx.textAlign = 'left';
        ctx.fillStyle = shieldColor;
        ctx.fillText(`${secondsLeft}s`, barX + barWidth + 4, barY + 7.5);

        ctx.restore();
      }

      // Invulnerability Energy Shield Bubble (during/after revive)
      if (reviveShieldTimer > 0) {
        reviveShieldTimer--;
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#10b981';
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        const screenY = canvas.height - (player.y - cameraY);
        ctx.arc(player.x, screenY, 26, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
        ctx.fill();
        ctx.restore();
      }

      // 3-Second Safe Countdown Overlay
      if (gameState === 'revive_countdown') {
        ctx.save();
        ctx.textAlign = 'center';

        // Dark translucent backdrop
        ctx.fillStyle = 'rgba(5, 7, 15, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Pulsing countdown number
        ctx.shadowBlur = 24;
        ctx.shadowColor = '#10b981';
        ctx.fillStyle = '#34d399';
        ctx.font = '900 68px "Outfit", monospace';
        const displayDigit = reviveCountdown > 0 ? reviveCountdown.toString() : t.countdownGo;
        ctx.fillText(displayDigit, canvas.width / 2, canvas.height / 2 - 10);

        // Subtitle
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff';
        ctx.font = '700 12px "Outfit", monospace';
        ctx.letterSpacing = '3px';
        ctx.fillText(`🛡️ ${t.countdownReady}`, canvas.width / 2, canvas.height / 2 + 35);
        ctx.restore();
      }

      ctx.restore();
    }

    let lastFrameTime = 0;

    function gameLoop(timestamp) {
      if (gameState !== 'playing' && gameState !== 'revive_countdown') return;

      if (!lastFrameTime) {
        lastFrameTime = timestamp || performance.now();
      }

      const now = timestamp || performance.now();
      let elapsed = now - lastFrameTime;
      lastFrameTime = now;

      // Clamp elapsed time to prevent physics jumps on background tab switch / lag spike
      if (elapsed > 66) elapsed = 66;
      if (elapsed < 1) elapsed = 8.333; // High-precision support for 120Hz/144Hz+ displays

      // Smooth normalized delta-time: 1.0 at 60 FPS, 0.5 at 120 FPS
      const dt = elapsed / 16.6667;

      update(dt);
      draw();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Security payload for score verification
    function getSecurityPayload() {
      roundDuration = (Date.now() - roundStartTime) / 1000;
      const secretModifier = 8291;
      const signature = Math.round((score * 63) + (totalHops * 17) + (roundDuration * 2.2) + secretModifier);
      
      return {
        gameCode: 'crossy_neon_road_v1',
        hopCount: totalHops,
        durationSeconds: roundDuration,
        clientIntegritySig: signature,
        distanceReached: score,
        revived: hasRevived
      };
    }

    function triggerGameOver() {
      gameState = 'gameover';
      cancelAnimationFrame(animationFrameId);
      soundManager.playCrash();
      setTimeout(() => soundManager.playGameOver(), 180);
      soundManager.stopMusic();
      
      // Hide virtual D-pad
      dpad.style.display = 'none';

      // Persist new personal highscore if beaten
      if (score > savedHighscore) {
        savedHighscore = score;
        try {
          localStorage.setItem('tggamehub_crossyneonroad_highscore', savedHighscore.toString());
        } catch(e) {}
      }

      finalScoreEl.innerText = score.toLocaleString();

      // Strictly 1x free revive per round:
      if (!hasRevived) {
        reviveBtn.style.display = 'flex';
      } else {
        reviveBtn.style.display = 'none';
        window.parent.postMessage({
          type: 'SUBMIT_SCORE',
          score: score,
          validationPayload: getSecurityPayload()
        }, '*');
      }

      gameOverScreen.style.display = 'flex';
    }

    function movePlayer(dir) {
      if (gameState === 'playing' && player) {
        player.move(dir);
      }
    }

    // Swipe controls for mobile
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (gameState !== 'playing') return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);

      if (Math.max(absX, absY) > 30) { // minimum threshold of 30px swipe
        if (absX > absY) {
          if (dx > 0) movePlayer('right');
          else movePlayer('left');
        } else {
          if (dy > 0) movePlayer('down');
          else movePlayer('up');
        }
      }
    }, { passive: true });

    // Keyboard bindings (Arrow Keys & WASD + Audio Keys)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyM') {
        soundManager.toggleMusic();
        return;
      }
      if (e.code === 'KeyS') {
        // Only toggle SFX when not playing (to avoid conflict with movement)
        if (gameState !== 'playing') {
          soundManager.toggleSfx();
          return;
        }
      }
      
      if (gameState !== 'playing') return;
      
      if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        movePlayer('up');
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        e.preventDefault();
        movePlayer('down');
      } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        e.preventDefault();
        movePlayer('left');
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        movePlayer('right');
      }
    });

    // Touch Dpad Click integrations
    btnUp.addEventListener('click', (e) => { e.preventDefault(); movePlayer('up'); });
    btnLeft.addEventListener('click', (e) => { e.preventDefault(); movePlayer('left'); });
    btnDown.addEventListener('click', (e) => { e.preventDefault(); movePlayer('down'); });
    btnRight.addEventListener('click', (e) => { e.preventDefault(); movePlayer('right'); });

    // Prevent native context menu & text selection popups on long press
    window.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    // Robust button click / touch binding (supports touch, mouse, webview with debounce)
    function bindButton(btn, callback) {
      if (!btn) return;
      let lastTrigger = 0;
      const trigger = (e) => {
        if (e && e.cancelable) {
          e.preventDefault();
          e.stopPropagation();
        }
        const now = Date.now();
        if (now - lastTrigger < 250) return;
        lastTrigger = now;
        callback();
      };
      btn.addEventListener('click', trigger);
      btn.addEventListener('touchend', trigger, { passive: false });
    }

    // Start & Retry buttons
    bindButton(startBtn, () => {
      startScreen.style.display = 'none';
      gameState = 'playing';
      soundManager.init();
      soundManager.startMusic();
      initGame();
      lastFrameTime = performance.now();
      animationFrameId = requestAnimationFrame(gameLoop);
    });

    bindButton(reviveBtn, () => {
      window.parent.postMessage({ type: 'REQUEST_AD_REVIVE' }, '*');
    });

    bindButton(retryBtn, () => {
      gameOverScreen.style.display = 'none';
      window.parent.postMessage({
        type: 'SUBMIT_SCORE_AND_RETRY',
        score: score,
        validationPayload: getSecurityPayload()
      }, '*');
    });

    bindButton(backMenuBtn, () => {
      window.parent.postMessage({
        type: 'SUBMIT_SCORE',
        score: score,
        validationPayload: getSecurityPayload()
      }, '*');
      window.parent.postMessage({
        type: 'CLOSE_GAME'
      }, '*');
    });

    bindButton(sfxBtn, () => {
      soundManager.toggleSfx();
    });

    bindButton(musicBtn, () => {
      soundManager.toggleMusic();
    });

    // ── Listen for Rewarded Ad Completion from Parent Window ─────────────────
    window.addEventListener('message', event => {
      if (event.data?.type === 'AD_REVIVE_GRANTED' && !hasRevived) {
        hasRevived = true;
        gameOverScreen.style.display = 'none';
        reviveBtn.style.display = 'none';

        // 1. Give 1 life and place player safely on a solid grass row
        lives = 1;
        player.col = 4;
        player.x = 4 * COL_WIDTH + COL_WIDTH / 2;
        player.targetX = player.x;
        player.y = player.row * ROW_HEIGHT + ROW_HEIGHT / 2;
        player.targetY = player.y;
        player.hopTimer = 0;
        player.shieldTime = 300;

        // Convert player row and neighboring rows into guaranteed safe grass zones
        for (let r = player.row - 1; r <= player.row + 1; r++) {
          if (r >= 0) {
            const safeRow = new Row(r);
            safeRow.type = 'safe';
            safeRow.obstacles = [];
            safeRow.trainActive = false;
            safeRow.warningActive = false;
            rows[r] = safeRow;
          }
        }

        // 2. 3-second safe countdown & invulnerability shield
        reviveShieldTimer = 240; // 4 seconds of protective shield
        reviveCountdown = 3;
        gameState = 'revive_countdown';
        soundManager.init();
        soundManager.startMusic();
        soundManager.playShield();

        if ('ontouchstart' in window) {
          dpad.style.display = 'grid';
        }

        if (reviveCountdownTimer) clearInterval(reviveCountdownTimer);
        reviveCountdownTimer = setInterval(() => {
          reviveCountdown--;
          if (reviveCountdown === 2 || reviveCountdown === 1) {
            soundManager.playShield();
          } else if (reviveCountdown <= 0) {
            clearInterval(reviveCountdownTimer);
            reviveCountdownTimer = null;
            soundManager.playCoin();
            gameState = 'playing';
          }
        }, 1000);

        lastFrameTime = performance.now();
        cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    });

    // Draw initial cover background
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
